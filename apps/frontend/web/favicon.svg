<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="12" fill="#007be5"/>
  
  <!-- Helpdesk ticket icon -->
  <g transform="translate(32, 20)">
    <!-- Main ticket body -->
    <rect x="-14" y="-6" width="28" height="20" rx="3" fill="white" stroke="none"/>
    <!-- Left perforation -->
    <circle cx="-10" cy="0" r="2.5" fill="#007be5"/>
    <!-- Right perforation -->
    <circle cx="10" cy="0" r="2.5" fill="#007be5"/>
    <!-- Ticket lines (detail) -->
    <line x1="-10" y1="2" x2="10" y2="2" stroke="#007be5" stroke-width="0.8" opacity="0.3"/>
    <line x1="-10" y1="6" x2="10" y2="6" stroke="#007be5" stroke-width="0.8" opacity="0.3"/>
  </g>
  
  <!-- TENX Text - bold and prominent -->
  <text x="32" y="50" 
        font-family="'Arial', 'Helvetica', 'Verdana', sans-serif" 
        font-size="15" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="1">TENX</text>
</svg>
