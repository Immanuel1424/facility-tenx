name: facility_erp
description: Multi-tenant ERP SaaS Flutter application
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  get_it: ^7.7.0

  # Networking
  dio: ^5.4.0
  json_annotation: ^4.8.1
  logger: ^2.6.2

  # Authentication & Security
  flutter_secure_storage: ^9.0.0
  oauth2: ^2.0.2
  openid_client: ^0.4.8

  # UI & Theming
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.1.2
  go_router: ^13.0.0
  google_fonts: ^6.1.0
  pluto_grid: ^8.1.0
  intl: ^0.20.2

  # Utilities
  equatable: ^2.0.5
  fpdart: ^1.1.0
  uuid: ^4.2.1
  file_picker: ^8.0.0+1
  flutter_dotenv: ^5.1.0
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.2
  archive: ^3.4.0

  # Icons & Assets
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  image: ^4.1.3

  # Animations
  flutter_animate: ^4.5.0

  # Charts & Visualization
  fl_chart: ^0.66.0
  timeline_tile: ^2.0.0
  package_info_plus: ^9.0.0

  # Push Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation (keep only what is still used)
  riverpod_generator: ^2.3.9
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.9

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: Inter
      fonts:
        # Only load essential font weights to reduce bundle size
        # Regular (400) and Medium (500) are most commonly used
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        # Light (300) for secondary text
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300

dependency_overrides:
  rxdart: ^0.28.0
