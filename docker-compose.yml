# Development Docker Compose Configuration
# Usage: docker-compose up -d
# Note: This uses local PostgreSQL instance via host.docker.internal
# For full containerized setup, use docker-compose.prod.yml

services:
  # NestJS Backend API (Development)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: facility-erp-backend-dev
    environment:
      # Database (pointing to local system database)
      # Use host.docker.internal on Mac/Windows, or your host IP on Linux
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-facility_erp}

      # Application
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3000}

      # JWT Configuration (REQUIRED - must be set in .env file)
      # Generate strong secrets: openssl rand -base64 32
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-30}

      # Session (REQUIRED - must be set in .env file)
      # Generate strong secret: openssl rand -base64 32
      SESSION_SECRET: ${SESSION_SECRET}

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80,http://localhost:8080}

      # Email Configuration (AWS SES)
      AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID:-}
      AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY:-}
      AWS_SES_REGION: ${AWS_SES_REGION:-ap-south-1}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-}
      AWS_SES_FROM_NAME: ${AWS_SES_FROM_NAME:-Helixsense}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend_uploads:/app/uploads
    # Removed postgres dependency - using local system database
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - facility-erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Flutter Web Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: facility-erp-frontend-dev
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - facility-erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  backend_uploads:
    driver: local
    name: facility-erp-backend-uploads-dev

networks:
  facility-erp-network:
    driver: bridge
