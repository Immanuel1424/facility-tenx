# Production Docker Compose Configuration
# Usage: docker-compose -f docker-compose.prod.yml up -d
# Note: Uses external PostgreSQL database (configure via DB_HOST in .env)
# Uses pre-built images from Docker Hub

services:
  # NestJS Backend API
  backend:
    # Use pre-built image from Docker Hub
    image: hsense/facility-erp-backend:1.0.13
    container_name: facility-erp-backend-prod
    platform: linux/amd64
    environment:
      # Database connection (external PostgreSQL - set DB_HOST in .env)
      # Examples:
      #   - Local: host.docker.internal
      #   - Remote: your-db-host.example.com
      #   - Cloud RDS: your-rds-endpoint.region.rds.amazonaws.com
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-facility_erp}

      # Application
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3000}

      # JWT Configuration (REQUIRED - must be set in .env file)
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-30}

      # Session (REQUIRED - must be set in .env file)
      SESSION_SECRET: ${SESSION_SECRET}

      # CORS (comma-separated list of allowed origins)
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}

      # Email Configuration (AWS SES)
      AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID}
      AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY}
      AWS_SES_REGION: ${AWS_SES_REGION:-ap-south-1}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL}
      AWS_SES_FROM_NAME: ${AWS_SES_FROM_NAME:-Helixsense}

      # Frontend URL (REQUIRED for email templates with login links)
      # This is the base URL where your frontend application is hosted
      # Examples:
      #   - Production: https://yourdomain.com
      #   - Production: https://hsense-test-v1.helixsense.com
      FRONTEND_URL: ${FRONTEND_URL}

      # Firebase Configuration (for Push Notifications)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}

      # Gemini AI Configuration (OPTIONAL - for AI ticket analysis feature)
      # Get your key from: https://makersuite.google.com/app/apikey
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # Storage Provider Configuration
      # Storage Provider: 'local' or 's3' (default: 'local')
      # - 'local': Store files in ./uploads directory on the server
      # - 's3': Store files in AWS S3 bucket
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}

      # Local Storage Configuration (used when STORAGE_PROVIDER=local)
      UPLOADS_DIR: ${UPLOADS_DIR:-uploads}
      UPLOADS_BASE_URL: ${UPLOADS_BASE_URL:-/api/uploads}

      # AWS S3 Configuration (only needed if STORAGE_PROVIDER=s3)
      AWS_S3_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY_ID:-}
      AWS_S3_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-south-1}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      AWS_S3_BASE_PREFIX: ${AWS_S3_BASE_PREFIX:-tenx-attachments}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      # Bind mount for local storage (files stored in ./uploads on host)
      # For S3 storage, this volume is not needed but won't cause issues
      - ./uploads:/app/uploads
    # Connect to external database - no depends_on needed
    # For local database access, add: extra_hosts: ["host.docker.internal:host-gateway"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - facility-erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Flutter Web Frontend
  frontend:
    # Use pre-built image from Docker Hub
    image: hsense/facility-erp-frontend:1.0.13
    container_name: facility-erp-frontend-prod
    platform: linux/amd64
    environment:
      # API Base URL (REQUIRED - must be set in .env file)
      # DO NOT use localhost in production - it will not work!
      # Examples:
      #   - Docker internal network: http://backend:3000/api/v1
      #   - External backend: https://api.yourdomain.com/api/v1
      #   - Same domain: https://yourdomain.com/api/v1
      #   - With reverse proxy: https://yourdomain.com/api/v1
      # NOTE: If not set, the container will fail to start (by design)
      API_BASE_URL: ${API_BASE_URL}
      # Set NODE_ENV to production to enforce strict validation
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - facility-erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

# Named volume no longer needed - using bind mount ./uploads:/app/uploads instead
# volumes:
#   backend_uploads:
#     driver: local
#     name: facility-erp-backend-uploads

networks:
  facility-erp-network:
    driver: bridge
    name: facility-erp-network
