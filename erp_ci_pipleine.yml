trigger:
  branches:
    include:
    - develop
    - release/*

variables:
- group: facility-erp-ci-vars
- name: PLATFORM
  value: linux/amd64

stages:
- stage: CI
  displayName: CI – Branch Check, Versioning, Build & Push
  jobs:
  # -------------------------------
  # Job 1: Branch Check & Version Resolver
  # -------------------------------
  - job: Branch_Check
    displayName: 'Resolve Image Version'
    pool:
      name: 'test-one'
    steps:
    - bash: |
        set -e

        PROJECT="$(echo "$(Build.Repository.Name)" | awk -F'/' '{print $2}')"
        BRANCH="$(echo "$(Build.SourceBranch)" | cut -d '/' -f 3- )" 
        IMAGE_VERSION=""
        STOP_PIPELINE=false
        SKIP_CD=false

        echo "Triggered branch: $BRANCH_NAME"
        echo "Expected release version: $RELEASE_BRANCH"
        echo "Project name: $PROJECT"

        # -------------------------------
        # Branch detection logic
        # -------------------------------
        if [[ "$BRANCH_NAME" == "develop" ]]; then
            echo "##[warning] develop branch detected - skipping release check and continuing."
            IMAGE_VERSION="$DEVELOP_IMAGE_VERSION"

        elif [[ "$BRANCH_NAME" == release/* ]]; then
            CURRENT_RELEASE="$BRANCH_NAME"
            echo "Release branch detected: $CURRENT_RELEASE"

            if [[ "$CURRENT_RELEASE" == "$RELEASE_BRANCH" ]]; then
                echo "Release matches variable group value. Continuing..."
                STOP_PIPELINE=false
                SKIP_CD=false

            elif [[ "$CURRENT_RELEASE" != "$RELEASE_BRANCH" && "$(Build.Reason)" == "Manual" ]]; then
                echo "Manual build with release mismatch. Skipping CD trigger job."
                STOP_PIPELINE=false
                SKIP_CD=true

            else
                echo "Release mismatch on automated build. Failing pipeline."
                STOP_PIPELINE=true
                SKIP_CD=true
                exit 1
            fi

            # -------------------------------
            # Get latest image version from Docker Hub (incremental)
            # -------------------------------
            get_next_version() {
              echo "Fetching latest Docker image version from Docker Hub..."
              TAGS=$(curl -s -u "$DOCKER_USERNAME:$DOCKER_PAT" \
                "https://hub.docker.com/v2/repositories/$DOCKER_USERNAME/$DOCKER_REPO_BACKEND/tags?page_size=100" \
                | jq -r '.results[].name' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V)

              if [[ -z "$TAGS" ]]; then
                echo "No existing tags found, starting from 1.0.0"
                echo "1.0.0"
                return
              fi

              LATEST=$(echo "$TAGS" | tail -n 1)
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
              PATCH=$((PATCH + 1))

              echo "$MAJOR.$MINOR.$PATCH"
            }

            IMAGE_VERSION="$(get_next_version)"
            echo "Release branch → auto-incremented version $IMAGE_VERSION"

        else
            echo "❌ Invalid branch"
            STOP_PIPELINE=true
            SKIP_CD=true
            exit 1
        fi

        echo "Final image version: $IMAGE_VERSION"

        # -------------------------------
        # Export variables for downstream jobs
        # -------------------------------
        echo "##vso[task.setvariable variable=IMAGE_VERSION;isOutput=true]$IMAGE_VERSION"
        echo "##vso[task.setvariable variable=BRANCH_NAME;isOutput=true]$BRANCH_NAME"
        echo "##vso[task.setvariable variable=STOP_PIPELINE;isOutput=true]$STOP_PIPELINE"
        echo "##vso[task.setvariable variable=SKIP_CD;isOutput=true]$SKIP_CD"
      name: CheckBranch
      displayName: 'Branch & Version Resolver'
      continueOnError: true
      env:
        DOCKER_USERNAME: $(docker_username)
        DOCKER_PAT: $(docker_pat)
        DOCKER_REPO_BACKEND: $(docker_repo_backend)
        DEVELOP_IMAGE_VERSION: $(develop_image_version)
        RELEASE_BRANCH: $(sprint_release_branch)

  # -------------------------------
  # Job 2: Docker Build & Push
  # -------------------------------
  - job: Docker_Build_Push
    displayName: 'Docker Build & Push'
    dependsOn: Branch_Check
    pool:
      name: 'test-one'
    condition: and(
      succeeded(),
      eq(dependencies.Branch_Check.outputs['CheckBranch.STOP_PIPELINE'], 'false'),
      eq(dependencies.Branch_Check.outputs['CheckBranch.SKIP_CD'], 'false'))
    variables:
      IMAGE_VERSION: $[ dependencies.Branch_Check.outputs['CheckBranch.IMAGE_VERSION'] ]
      BRANCH_NAME: $[ dependencies.Branch_Check.outputs['CheckBranch.BRANCH_NAME'] ]
      GIT_COMMIT: $(Build.SourceVersion)
      PROJECT_NAME: $(Build.Repository.Name)
    steps:
    - bash: |
        set -e

        echo "$(DOCKER_PAT)" | docker login -u "$(DOCKER_USERNAME)" --password-stdin

        docker buildx create --name facility-erp-builder --use || true
        docker buildx inspect --bootstrap

        echo "Building Backend"
        docker buildx build \
          --platform $(PLATFORM) \
          --tag $(DOCKER_USERNAME)/facility-erp-backend:$(IMAGE_VERSION) \
          --label org.opencontainers.image.version="$(IMAGE_VERSION)" \
          --label org.opencontainers.image.ref.name="$(BRANCH_NAME)" \
          --label org.opencontainers.image.revision="$(GIT_COMMIT)" \
          --label org.opencontainers.image.created="$(BUILD_TIME)" \
          --load \
          -f apps/backend/Dockerfile \
          apps/backend

        echo "Building Frontend"
        docker buildx build \
          --platform $(PLATFORM) \
          --tag $(DOCKER_USERNAME)/facility-erp-frontend:$(IMAGE_VERSION) \
          --label org.opencontainers.image.version="$(IMAGE_VERSION)" \
          --label org.opencontainers.image.ref.name="$(BRANCH_NAME)" \
          --label org.opencontainers.image.revision="$(GIT_COMMIT)" \
          --label org.opencontainers.image.created="$(BUILD_TIME)" \
          --load \
          -f apps/frontend/Dockerfile \
          apps/frontend

        docker push $(DOCKER_USERNAME)/facility-erp-backend:$(IMAGE_VERSION)
        docker push $(DOCKER_USERNAME)/facility-erp-frontend:$(IMAGE_VERSION)

        echo "Docker images pushed successfully"
      env:
        DOCKER_USERNAME: $(docker_username)
        DOCKER_PAT: $(docker_pat)

