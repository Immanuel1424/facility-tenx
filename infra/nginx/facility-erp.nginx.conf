# Standard Nginx Configuration for TENX
# Save this to /etc/nginx/sites-available/facility-erp

server {
    listen 80;
    server_name your-domain.com; # REPLACE WITH YOUR DOMAIN

    # Frontend (Flutter Web)
    # -----------------------
    location / {
        # Path to the build/web directory from your repository
        root /home/ubuntu/projects/facility-erp/apps/frontend/build/web;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Enable compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    }

    # Backend API Proxy
    # ------------------
    location /api/v1/ {
        proxy_pass http://localhost:3000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts for long-running operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Swagger Documentation
    # ----------------------
    location /api/docs {
        proxy_pass http://localhost:3000/api/docs;
        proxy_set_header Host $host;
    }

    # Media / Uploads - Proxy to backend for S3 presigned URL redirects
    # Files are stored in S3, not on local filesystem
    # Backend generates presigned URLs and redirects (302) to S3
    # This provides backward compatibility for legacy /uploads/* URLs
    # -------------------------------
    location /uploads/ {
        proxy_pass http://localhost:3000/api/v1/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Pass through authorization header for authenticated downloads
        proxy_set_header Authorization $http_authorization;
        
        # Follow redirects (S3 presigned URLs)
        proxy_redirect off;
        
        # Increase timeouts for file downloads
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
